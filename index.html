<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greenspace Finance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">Greenspace Finance</div>
        <div class="brand-sub">Greenspace Consulting Limited</div>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#timesheet" data-view="timesheet">Timesheet</a>
      <a href="#invoicing" data-view="invoicing">Invoicing</a>
      <a href="#landscaping" data-view="landscaping">Landscaping</a>
      <a href="#setup" data-view="setup">Setup</a>
    </nav>
    <div class="data-status">
      <span id="dataChip" class="chip">Loading ...</span>
      <input id="fileInput" type="file" accept=".xlsx,.xlsm" hidden>
    </div>
  </div>
</header>

<main id="app" class="wrap">
  <section id="view-loading" class="view" hidden><p class="muted">Loading your data ...</p></section>
  <section id="view-empty" class="view" hidden></section>
  <section id="view-dashboard" class="view" hidden></section>
  <section id="view-timesheet" class="view" hidden></section>
  <section id="view-invoicing" class="view" hidden></section>
  <section id="view-landscaping" class="view" hidden></section>
  <section id="view-setup" class="view" hidden></section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="js/core.js"></script>
<script src="js/billing-defaults.js"></script>
<script src="js/app.js"></script>
</body>
</html>
